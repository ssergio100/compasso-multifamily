name: compasso

services:
  compasso-api:
    image: compasso-api:${COMPASSO_VERSION:-0.1.0-dev}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TEMPO_ADMIN_ORIGIN: ${COMPASSO_ADMIN_ORIGIN:-same-host}
      TEMPO_SECURE_COOKIES: ${COMPASSO_SECURE_COOKIES:-false}
      TEMPO_HEARTBEAT_INTERVAL: ${COMPASSO_HEARTBEAT_INTERVAL:-3s}
      TEMPO_SMTP_ADDRESS: ${COMPASSO_SMTP_ADDRESS:-}
      TEMPO_SMTP_USERNAME: ${COMPASSO_SMTP_USERNAME:-}
      TEMPO_SMTP_PASSWORD: ${COMPASSO_SMTP_PASSWORD:-}
      TEMPO_SMTP_FROM: ${COMPASSO_SMTP_FROM:-}
      TEMPO_REQUIRE_INSTALLATION_IDENTITY: ${COMPASSO_REQUIRE_INSTALLATION_IDENTITY:-false}
    volumes:
      - type: bind
        source: ${COMPASSO_DATA_DIRECTORY:-/srv/docker/volumes/compasso}/server
        target: /var/lib/tempo-server
    ports:
      - "${COMPASSO_API_BIND_ADDRESS:-0.0.0.0}:${COMPASSO_API_PORT:-8181}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
